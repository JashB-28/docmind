name: Deploy (CD)

# Deploys automatically on every push to main; the manual button remains
# available for re-deploys without a code change.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write   # for GitHub OIDC → AWS (used by the SSM deploy step)
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE: jash09/docmind

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # Temporary AWS creds via OIDC — only needed to send the SSM command.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Tell the EC2 box to pull the new image and restart — over SSM, so there
      # is no inbound SSH and no SSH key to manage. DEPLOY_DIR is a repo variable
      # (Settings → Variables) pointing at the clone on the box; it defaults to
      # the live path if unset, so the box's actual location is configurable
      # without touching this file.
      - name: Deploy on EC2 via SSM Run Command
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ec2-user/docmind' }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DocMind ${{ github.sha }}" \
            --parameters commands="cd $DEPLOY_DIR && git pull --ff-only && bash deploy/deploy.sh" \
            --region "$AWS_REGION" \
            --query Command.CommandId --output text)
          echo "SSM command sent: $CMD_ID — waiting for the box to finish..."

          # send-command only queues the deploy; poll until it actually finishes
          # on the instance so a box-side failure fails this workflow (up to 5 min).
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 5
          done

          echo "=== box stdout ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
            --query StandardOutputContent --output text
          echo "=== box stderr ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
            --query StandardErrorContent --output text

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
